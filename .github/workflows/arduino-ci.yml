name: Arduino CI — Genum_4WD4M_CAR

# Runner prerequisites (Windows self-hosted, the actions-runner* dirs on the
# bench machine):
#   - Git Bash on PATH. Every job pins `shell: bash` because the runner has no
#     PowerShell 7 and otherwise hands bash-syntax steps to Windows PowerShell.
#   - `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned`. Windows defaults to
#     Restricted, and arduino/compile-sketches runs actions/setup-python, whose
#     downloaded setup.ps1 is blocked ("running scripts is disabled").

# Compile-gate the 4WD4M car firmware. This job does NOT touch any device:
# it proves the sketch still compiles for the exact fqbn the owner flashes
# (`esp32:esp32:esp32:PartitionScheme=huge_app` — README: Huge APP **REQUIRED**,
# Arduino core 4.0.0) and reports the flash/SRAM deltas so the round-13 matrix
# rows (R-20/R-20b, T-71a) that currently read "compile figures PENDING" get
# real numbers.
#
# Pass = compile succeeds + flash within Huge APP budget. Fail = sketch no
# longer builds → push/PR blocked until fixed.
#
# NOTE: `Config.h` pulls `secrets.h` behind `__has_include("secrets.h")` — a
# per-device gitignored file. arduino-ci makes the sketch compile with NO
# secrets provisioned (the `#else` branch fills placeholders), so no credential
# is ever needed in the repo or this workflow.

on:
  push:
    branches: [main]
    paths:
      - '**/*.ino'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.c'
      - '**/*.json'
      - '**/*.md'
      - 'tools/**'
      - '.github/workflows/arduino-ci.yml'
      - 'secrets.h.example'
  pull_request:
    paths:
      - '**/*.ino'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.c'
      - '**/*.json'
      - 'tools/**'
      - '.github/workflows/arduino-ci.yml'
  workflow_dispatch:

concurrency:
  group: arduino-ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here runs on the Windows self-hosted runner, which has no
# PowerShell 7, so `run:` steps were falling back to Windows PowerShell while
# they are written as bash.
defaults:
  run:
    shell: bash

jobs:
  page-js:
    # U-81: the setup page's HTML+JS lives in a C++ raw string, so the compiler
    # never looks at it. This job does — it parses the inline script and runs the
    # reply handler against the firmware's real strings, asserting that a
    # refusal is never rendered as a success. Kept separate from `compile` so a
    # page bug and a build break are reported as different failures.
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: The page's JavaScript parses and tells the truth
        run: node tools/check-webpage-js.mjs

  firmware-contract:
    # U-111: The Arduino job answers "does it compile". It cannot answer
    # "is the Internet method actually wired in" — a transport that compiles
    # and is never connected is indistinguishable from one that works. This
    # job reads the source and asserts the seams (drain, STATE fan-out,
    # connected(), loop pump), the grammar lock, the control prefix, the
    # restart-record rules, and the watchdog / WebSocket pump rules.
    #
    # Separate from `compile` so "the transport is half-wired" and "the build
    # broke" are different failures, and so the failure text is about the
    # contract rather than a compiler message about a translation unit.
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: The firmware contract holds
        run: node tools/check-firmware-contract.mjs

  compile:
    # 2026-10-23: PINNED OFF ubuntu-latest. GitHub rolled ubuntu-latest to
    # Ubuntu 26.04 and arduino/compile-sketches@v1 fails BEFORE the build —
    # its actions/setup-python step cannot find its pinned Python 3.12.4 for
    # 26.04 ("The version '3.12.4' with architecture 'x64' was not found"), so
    # three pushes in a row went red in ~16 s with the sketch never compiled.
    # 24.04 ships that Python and still runs the ESP32 4.0.0 build; move back
    # to -latest only once the action's Python pin supports it.
    #
    # 2026-11-22: moved to the self-hosted Windows runner, because the GitHub-
    # hosted minutes are exhausted and this job failed with NO steps run at all
    # (runner: none). The compile itself no longer uses arduino/compile-sketches:
    # that action shells out to actions/setup-python, whose installer needs admin
    # registry access (it deletes keys under HKEY_LOCAL_MACHINE\...\Products) and
    # left a broken python.exe behind on this runner, so the sketch never
    # compiled. The bench machine already has arduino-cli, the esp32 core and the
    # sketch libraries installed, so the job compiles directly.
    # Trade-off: the action's build-deltas report is no longer published; the
    # flash/RAM figures are still printed by the compile below.
    runs-on: self-hosted
    env:
      # The ESP32 core CI builds against. The core-pin check in
      # tools/check-firmware-contract.mjs reads this block and requires it to
      # equal $coreV in tools/check-firmware-syntax.ps1; the compile step below
      # also asserts the runner has exactly this core, so a drifted pin cannot
      # go green.
      CI_ESP32_PIN: |
        - name: esp32:esp32
          version: 4.0.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compile sketch
        env:
          ARDUINO_CLI: E:/Project/bin/arduino-cli.exe
        run: |
          set -euo pipefail
          if [ ! -f "$ARDUINO_CLI" ]; then
            echo "arduino-cli not found at $ARDUINO_CLI" >&2
            exit 1
          fi
          pinned=$(printf '%s\n' "$CI_ESP32_PIN" | sed -n 's/^ *version: *//p')
          installed=$("$ARDUINO_CLI" core list | awk '$1 == "esp32:esp32" { print $2 }')
          if [ "$installed" != "$pinned" ]; then
            echo "core drift: workflow pins $pinned but the runner has [$installed]" >&2
            exit 1
          fi
          "$ARDUINO_CLI" compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --build-path build/ci-out \
            --warnings default \
            .
